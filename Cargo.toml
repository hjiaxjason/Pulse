[package]
name = "pulse"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pulse"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
plist = "1.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
tempfile = "3.27.0"
